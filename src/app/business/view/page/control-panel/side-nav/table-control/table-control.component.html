<div  *ngIf="dataSource"
      class="mat-elevation-z8 table-main">
  <table
         mat-table
         [dataSource]="dataSource"
         matSort
         class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> id </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> date </th>
      <td mat-cell *matCellDef="let element"> {{element.date}} </td>
    </ng-container>

    <ng-container matColumnDef="ip">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> ip </th>
      <td mat-cell *matCellDef="let element"> {{element.ip}} </td>
    </ng-container>

    <ng-container matColumnDef="agent">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> agent </th>
      <td mat-cell *matCellDef="let element"> {{element.agent}} </td>
    </ng-container>

    <ng-container matColumnDef="path">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> path </th>
      <td mat-cell *matCellDef="let element"> {{element.path}} </td>
    </ng-container>

    <ng-container matColumnDef="language">
      <th mat-header-cell mat-sort-header class="control-accent" *matHeaderCellDef> language </th>
      <td mat-cell *matCellDef="let element"> {{element.language}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>


  <mat-paginator [pageSizeOptions]="[10, 20, 50, 100, dataSourceLength]" showFirstLastButtons [pageSize]="10"></mat-paginator>
</div>
