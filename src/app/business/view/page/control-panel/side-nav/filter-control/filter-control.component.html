<mat-accordion>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        Фильтрация
      </mat-panel-title>
      <mat-panel-description class="d-flex justify-content-end">
        <mat-icon>
          filter_list
        </mat-icon>
      </mat-panel-description>
    </mat-expansion-panel-header>
    <form [formGroup]="fgVisitorsFilter" class="d-flex gap-2">
      <mat-form-field class="input-ip">
        <mat-label>ip</mat-label>
        <input formControlName="ip" type="text" matInput>
        <button matSuffix mat-icon-button
                (click)="fgVisitorsFilter.controls['ip'].setValue('')">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field class="select-desc pe-3">
        <mat-label>Наличие описания</mat-label>
        <mat-select [value]="selectDescriptionObject[0].value[1]">
          <mat-option *ngFor="let option of selectDescriptionObject"
                      (click)="onClickChangeIpDescFilter(option.value[0])"
                      [value]="option.value[1]">
            {{option.viewValue}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-expansion-panel>
</mat-accordion>
