<mat-drawer-container autosize class="example-container">
  <mat-drawer mode="side" class="example-sidenav">
    <button class="btn btn-dark mb-2" [routerLink]="['/']">На главную</button>
    <p class="control-accent">Версия 1.1</p>
  </mat-drawer>
  <div class="example-sidenav-content">
    <mat-tab-group animationDuration="0ms">
      <mat-tab label="Посетители">
        <button type="button" color="basic" mat-stroked-button class="m-3" (click)="updateAndGetVisitors()">
          Обновить посетителей
        </button>

        <app-table-control [dataFromAllVisitorsList]="dataVisitorsList"></app-table-control>
      </mat-tab>
      <mat-tab label="Заявки">Скоро</mat-tab>
    </mat-tab-group>
  </div>
</mat-drawer-container>
