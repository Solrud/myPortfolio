<div class="auth-modal-container">
    <div class="modal-header">
      <span class="m-3 fw-bold">Вход в админ панель:</span>
    </div>
    <div class="modal-body">
      <form class="mx-3" [formGroup]="fgPassword">
        <label for="password" class="form-label">Введите пароль:</label>
        <input id="password"
               autocomplete="off"
               class="form-control auth-input"
               formControlName="password"
               type="password">
      </form>
    </div>
    <div class="modal-footer">
      <button [routerLink]="['/']" class="btn btn-outline-dark">На главную</button>
      <button class="btn btn-dark m-3"
              (click)="onClickLogin()"
              [disabled]="fgPassword.controls['password'].invalid || isDisabledButtonLogin"
      >Войти</button>
    </div>
  </div>
