<div class="  modal-dialog-centered ">
  <div class="light-border modal-content">
    <div class="d-flex flex-column modal-body justify-content-center align-items-center">
      <h2 class="mt-3">Оставьте свои контакты!</h2>
      <h5>Для уточнения деталей</h5>
    </div>
    <div class="modal-body d-flex flex-column black-bg-main">
      <form [formGroup]="fgContacts">
        <div class="d-flex">
          <div class="d-flex flex-column me-4 flex-grow-1">
            <label for="firstName">Имя</label>
            <div class="form-group input-group mb-1">
              <input class="form-control border-dark grey-bg-main"
                     id="firstName"
                     formControlName="firstName"
                     autocomplete="off"
                     type="text"
                     [required]="fgContacts.controls['firstName'].hasValidator(Validators.required)">
    <!--          <button class="btn btn-light border-dark">-->
    <!--            <i class="bi bi-x-lg"></i>-->
    <!--          </button>-->
            </div>
          </div>

          <div class="d-flex flex-column flex-grow-1">
            <label for="email">Email</label>
            <div class="form-group input-group mb-1">
              <input class="form-control border-dark grey-bg-main"
                     id="email"
                     formControlName="email"
                     autocomplete="off"
                     type="text"
                     [required]="fgContacts.controls['email'].hasValidator(Validators.email)">
    <!--          <button class="btn btn-light border-dark">-->
    <!--            <i class="bi bi-x-lg"></i>-->
    <!--          </button>-->
            </div>
          </div>
        </div>

        <label for="question">Тема вопроса</label>
        <div class="form-group input-group mb-1">
          <input class="form-control border-dark grey-bg-main"
                 id="question"
                 formControlName="question"
                 autoComplete="off"
                 type="text"
                 [required]="fgContacts.controls['question'].hasValidator(Validators.required)">
    <!--      <button class="btn btn-light border-dark">-->
    <!--        <i class="bi bi-x-lg"></i>-->
    <!--      </button>-->
        </div>

         <label for="comment">Комментарий</label>
        <div class="form-group input-group mb-1">
          <textarea class="form-control border-dark grey-bg-main"
                 id="comment"
                 formControlName="comment"
                 autoComplete="off"
                 type="text"
                 [required]="fgContacts.controls['comment'].hasValidator(Validators.nullValidator)"></textarea>
        </div>
      </form>
    </div>
    <div class="modal-body black-bg-main">
      <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-closed"
                type="button"
                ngbautofocus
                (click)="onClickCancel()">
          Отмена
        </button>
        <div>
          <i class="bi bi-envelope-fill me-3 bi-class"
             (click)="onClickMailIcon()"></i>
          <i class="bi bi-telegram bi-class"
             (click)="onClickTelegramIcon()"></i>
        </div>
        <button class="btn"
                type="button"
                [disabled]="fgContacts.invalid"
                (click)="onClickSendContact()">
          Отправить
        </button>
      </div>
  <!--    <span class="warning">*на данный момент отправка формы не работает</span>-->
  <!--    <div class="d-flex justify-content-center align-items-center">-->
  <!--      -->
  <!--    </div>-->
    </div>
  </div>
</div>
